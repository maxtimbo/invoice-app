[package]
name = "invoice-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "invoice-web"
path = "src/main.rs"

[dependencies]
invoice-core = { path = "../invoice-core" }
invoice-app = { path = "../invoice-app" }
invoice-storage = { path = "../invoice-storage" }
anyhow = "1.0.102"
axum = { version = "0.8.8", features = ["multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
tera = "1.20.1"
tokio = { version = "1.50.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs"] }
rust_decimal = "1.40.0"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
