{% extends "base.html" %}
{% block title %}New Invoice{% endblock %}
{% block content %}
<h1>New Invoice</h1>
<div class="form-card form-card-wide">
    <form method="post" id="invoice-form">

        <label>
            <span>Template</span>
            <select name="template_id" required>
                {% for t in templates %}
                <option value="{{ t.id }}">{{ t.name }}</option>
                {% endfor %}
            </select>
        </label>

        <label>
            <span>Date</span>
            <input name="date" type="date" required>
        </label>

        <label>
            <span>Stage</span>
            <select name="stage">
                <option value="Invoice">Invoice</option>
                <option value="Quote">Quote</option>
            </select>
        </label>

        <label class="checkbox-label">
            <input name="show_methods" type="checkbox" checked>
            <span>Show payment methods</span>
        </label>

        <label class="checkbox-label">
            <input name="show_notes" type="checkbox" checked>
            <span>Show notes</span>
        </label>

        <label>
            <span>Notes</span>
            <textarea name="notes" rows="3"></textarea>
        </label>

        <h3 class="section-title">Items</h3>

        <table class="mb-1">
            <thead>
                <tr><th>Name</th><th>Rate</th><th>Qty</th><th></th></tr>
            </thead>
            <tbody id="selected-items-body">
                <tr id="no-items-row"><td colspan="4" class="hint">No items added yet</td></tr>
            </tbody>
        </table>

        <details class="mb-1">
            <summary class="section-title">+ Add Item</summary>
            <div class="inline-form">
                <label class="field-grow">
                    <span>Item</span>
                    <select id="item-select">
                        {% for item in items %}
                        <option value="{{ item.id }}" data-name="{{ item.name }}" data-rate="{{ item.rate }}">
                            {{ item.name }} (${{ item.rate }})
                        </option>
                        {% endfor %}
                    </select>
                </label>
                <label class="field-fixed">
                    <span>Quantity</span>
                    <input id="item-qty" type="number" min="0.001" step="0.001" value="1">
                </label>
                <button type="button" onclick="addItem()">Add</button>
            </div>
        </details>

        <button type="button" class="button button-muted mb-1"
                onclick="document.getElementById('quick-item-modal').classList.add('open')">
            + New Item
        </button>

        <div id="quick-item-modal" class="modal-overlay">
            <div class="modal-card">
                <h3>New Item</h3>
                <label><span>Name</span><input id="qi-name"></label>
                <label><span>Rate</span><input id="qi-rate" type="number" min="0" step="0.01"></label>
                <div id="qi-error" class="modal-error"></div>
                <div class="actions mb-0">
                    <button type="button" onclick="quickCreateItem()">Create</button>
                    <button type="button" class="button button-muted" onclick="closeQuickItem()">Cancel</button>
                </div>
            </div>
        </div>

        <div id="items-hidden"></div>

        <div class="actions">
            <button type="submit">Create</button>
            <a class="button button-muted" href="/invoices">Cancel</a>
        </div>
    </form>
</div>

<script>
    const selected = {}; // id -> { name, rate, qty }

    function closeQuickItem() {
        document.getElementById('quick-item-modal').classList.remove('open');
        document.getElementById('qi-name').value = '';
        document.getElementById('qi-rate').value = '';
        const err = document.getElementById('qi-error');
        err.style.display = 'none';
        err.textContent = '';
    }

    async function quickCreateItem() {
        const name = document.getElementById('qi-name').value.trim();
        const rate = document.getElementById('qi-rate').value.trim();
        const err  = document.getElementById('qi-error');

        if (!name || !rate) {
            err.textContent = 'Name and rate are required.';
            err.style.display = 'block';
            return;
        }

        const body = new URLSearchParams({ name, rate });
        const res  = await fetch('/items', { method: 'POST', body });

        if (!res.ok) {
            err.textContent = 'Failed to create item.';
            err.style.display = 'block';
            return;
        }

        const listRes = await fetch('/items');
        const html    = await listRes.text();
        const doc     = new DOMParser().parseFromString(html, 'text/html');
        const rows    = doc.querySelectorAll('tbody tr');
        const lastRow = rows[rows.length - 1];
        const newName = lastRow?.querySelector('td a')?.textContent?.trim();
        const newRate = lastRow?.querySelector('td:nth-child(2)')?.textContent?.trim();
        const newHref = lastRow?.querySelector('td a')?.getAttribute('href') ?? '';
        const newId   = newHref.split('/').pop();

        if (!newId || !newName) {
            err.textContent = 'Item created but could not refresh list.';
            err.style.display = 'block';
            return;
        }

        const sel = document.getElementById('item-select');
        const opt = document.createElement('option');
        opt.value        = newId;
        opt.dataset.name = newName;
        opt.dataset.rate = newRate;
        opt.textContent  = `${newName} ($${newRate})`;
        opt.selected     = true;
        sel.appendChild(opt);

        closeQuickItem();
    }

    function addItem() {
        const sel = document.getElementById('item-select');
        const qty = parseFloat(document.getElementById('item-qty').value);
        if (!sel.value || isNaN(qty) || qty <= 0) return;

        const id  = sel.value;
        const opt = sel.options[sel.selectedIndex];
        selected[id] = { name: opt.dataset.name, rate: opt.dataset.rate, qty };
        renderTable();
    }

    function removeItem(id) {
        delete selected[id];
        renderTable();
    }

    function renderTable() {
        const tbody  = document.getElementById('selected-items-body');
        const hidden = document.getElementById('items-hidden');

        tbody.innerHTML  = '';
        hidden.innerHTML = '';

        const ids = Object.keys(selected);
        if (ids.length === 0) {
            tbody.innerHTML = '<tr id="no-items-row"><td colspan="4" class="hint">No items added yet</td></tr>';
            return;
        }

        for (const id of ids) {
            const item = selected[id];
            const tr   = document.createElement('tr');
            tr.id = `row-${id}`;
            tr.innerHTML = `
                <td>${item.name}</td>
                <td>$${item.rate}</td>
                <td id="qty-display-${id}">${item.qty}</td>
                <td>
                    <div class="td-actions">
                        <button type="button" onclick="editQty('${id}')">Edit Qty</button>
                        <button type="button" class="danger" onclick="removeItem('${id}')">Remove</button>
                    </div>
                </td>`;
            tbody.appendChild(tr);

            const inp   = document.createElement('input');
            inp.type    = 'hidden';
            inp.name    = `qty_${id}`;
            inp.value   = item.qty;
            hidden.appendChild(inp);
        }
    }

    function editQty(id) {
        const cell    = document.getElementById(`qty-display-${id}`);
        const current = selected[id].qty;
        cell.innerHTML = `
            <div class="qty-edit-form">
                <input id="qty-edit-${id}" type="number" min="0.001" step="0.001" value="${current}">
                <button type="button" onclick="saveQty('${id}')">✓</button>
            </div>`;
        document.getElementById(`qty-edit-${id}`).focus();
    }

    function saveQty(id) {
        const val = parseFloat(document.getElementById(`qty-edit-${id}`).value);
        if (isNaN(val) || val <= 0) return;
        selected[id].qty = val;
        renderTable();
    }
</script>
{% endblock %}
