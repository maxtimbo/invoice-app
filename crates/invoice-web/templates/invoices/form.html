{% extends "base.html" %}
{% block title %}New Invoice{% endblock %}
{% block content %}
<h1>New Invoice</h1>
<div class="form-card" style="max-width:640px">
  <form method="post">

    <label><span>Template</span>
      <select name="template_id" required>
        {% for t in templates %}
          <option value="{{ t.id }}">{{ t.name }}</option>
        {% endfor %}
      </select>
    </label>

    <label><span>Date</span>
      <input name="date" type="date" required>
    </label>

    <label><span>Stage</span>
      <select name="stage">
        <option value="Invoice">Invoice</option>
        <option value="Quote">Quote</option>
      </select>
    </label>

    <label class="checkbox-label">
      <input name="show_methods" type="checkbox" checked>
      <span>Show payment methods</span>
    </label>

    <label class="checkbox-label">
      <input name="show_notes" type="checkbox" checked>
      <span>Show notes</span>
    </label>

    <label><span>Notes</span>
      <textarea name="notes" rows="3"></textarea>
    </label>

    <h3 style="margin-bottom:0.75rem">Items</h3>
    <table>
      <thead>
        <tr><th>Name</th><th>Rate</th><th>Quantity</th></tr>
      </thead>
      <tbody>
      {% for item in items %}
        <tr>
          <td>{{ item.name }}</td>
          <td>${{ item.rate }}</td>
          <td>
            <input
              name="qty_{{ item.id }}"
              type="number"
              min="0"
              step="0.001"
              style="width:80px">
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>

    <div class="actions" style="margin-top:1rem">
      <button type="submit">Create</button>
      <a class="button button-muted" href="/invoices">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
