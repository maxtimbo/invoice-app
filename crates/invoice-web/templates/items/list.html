{% extends "base.html" %}

{% block title %}Items{% endblock %}

{% block content %}
<h1>Items</h1>
<div class="actions">
    <a class="button" href="/items/new">New Item</a>
</div>
<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Rate</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr>
            <td><a href="/items/{{ item.id }}">{{ item.name }}</a></td>
            <td>{{ item.rate }}</td>
            <td>
                <div class="td-actions">
                    <form method="post" action="/items/{{ item.id }}/delete">
                        <button class="danger" type="submit">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
